<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wellness Program</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f5f7fa;color:#182033}.app{max-width:430px;margin:auto;padding:16px 16px 90px}
.card{background:#fff;border:1px solid #e5eaf0;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#1f6feb;color:white;font-weight:700}.btn2{background:#eef4ff;color:#1f6feb}.chip{padding:8px 10px;border:1px solid #d9e1ea;background:#fff;border-radius:999px}
input,textarea,select{width:100%;padding:10px;margin:5px 0 10px;border:1px solid #d9e1ea;border-radius:10px;box-sizing:border-box}.screen{display:none}.screen.active{display:block}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:white;border-top:1px solid #ddd}.nav button{border:0;background:white;padding:10px 2px;font-size:11px}
.small{font-size:12px;color:#6f7a8a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:24px;font-weight:700}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#1f6feb}
</style></head><body><div class="app">
<h2 id="pageTitle">Wellness Program</h2><div id="pageSub" class="small">Clean test build</div>

<section id="login" class="screen active">
<div class="card"><h3>Member</h3><button class="btn" onclick="memberEntry()">Enter as Member</button></div>
<div class="card"><h3>Coach</h3><button class="btn btn2" onclick="coachEntry()">Enter as Coach</button></div>
</section>

<section id="onboard" class="screen">
<h3>New Member Onboarding</h3><div class="card">
<input id="memberNameInput" placeholder="Test member name">
<input id="coachNameInput" placeholder="Test coach name">
<select id="personalityInput"><option value="">Personality</option><option>Phlegmatic</option><option>Sanguine</option><option>Melancholic</option><option>Choleric</option></select>
<label>Start date</label><input id="startDateInput" type="date">
<input id="startWeightInput" type="number" step=".1" placeholder="Start weight kg">
<input id="sixWeekGoalInput" type="number" step=".1" placeholder="6-week goal loss kg">
<input id="ultimateGoalInput" type="number" step=".1" placeholder="Ultimate goal weight kg">
</div><h3>Supplements</h3><div class="card">
<input id="supplementNameInput" placeholder="Supplement name">
<label>Supplement start date</label><input id="supplementStartInput" type="date">
<input id="supplementNoteInput" placeholder="Coach note / focus">
<button class="btn btn2" onclick="addSupplement()">+ Add supplement</button>
<div id="supplementDraftList"></div></div>
<button class="btn" onclick="finishOnboarding()">Create Member</button>
</section>

<section id="home" class="screen">
<div class="card"><div class="row"><div><div class="small">Program position</div><div class="metric" id="positionText"></div></div><span class="tag" id="proteinDayTag">PROTEIN DAY</span></div></div>
<div class="grid">
<div class="card"><div class="small">Weight</div><div class="metric" id="homeWeight">—</div></div>
<div class="card"><div class="small">B4B</div><div class="metric" id="homeB4B">0</div></div>
<div class="card"><div class="small">Water</div><div class="metric" id="homeWater">0.0 L</div></div>
<div class="card"><div class="small">Carbs</div><div class="metric" id="homeCarbs">0 g</div></div>
</div><button class="btn" onclick="showMember('checkin')">Open Check-in</button>
</section>

<section id="checkin" class="screen">
<div class="card"><input id="todayWeightInput" type="number" step=".1" placeholder="Weight kg"><input id="todaySleepInput" type="number" step=".1" placeholder="Sleep hours"><button class="btn btn2" onclick="saveMorning()">Save morning</button></div>
<h3>B4B</h3><div class="card"><div class="metric" id="checkB4B">0 / 5,000</div><button class="chip" onclick="addSteps(1000)">+1000</button> <button class="chip" onclick="set5000()">Set 5000</button><button class="btn btn2" style="margin-top:10px" onclick="markBreakfast()">Mark breakfast started</button></div>
<h3>Water</h3><div class="card"><div class="metric" id="checkWater">0.0 L</div><button class="chip" onclick="addWater(.25)">+250 ml</button> <button class="chip" onclick="addWater(.5)">+500 ml</button> <button class="chip" onclick="addWater(1)">+1 L</button></div>
<h3>Food</h3><div class="card"><input id="foodNameInput" placeholder="Food/snack"><input id="foodCarbsInput" type="number" placeholder="Carbs g"><input id="foodProteinInput" type="number" placeholder="Protein g"><button class="btn btn2" onclick="addFood()">+ Add</button><div id="foodList"></div></div>
<div class="card"><textarea id="coachNoteInput" placeholder="Notes to coach"></textarea><button class="btn" onclick="completeCheckin()">Complete check-in</button></div>
</section>

<section id="progress" class="screen"><div class="card"><div class="metric" id="progressPosition"></div><div class="small" id="progressType"></div></div></section>
<section id="squad" class="screen"><div class="card">Squad feed placeholder</div></section>
<section id="profile" class="screen"><div class="card" id="profileCard"></div><h3>Supplements</h3><div class="card" id="profileSupplements"></div></section>

<section id="coachHome" class="screen"><div class="grid"><div class="card"><div class="small">Clients</div><div class="metric" id="clientCount">0</div></div><div class="card"><div class="small">Needs attention</div><div class="metric" id="attentionCount">0</div></div></div><h3>Alerts</h3><div class="card" id="alertList"></div><h3>Clients</h3><div class="card" id="clientList"></div></section>

<section id="coachClient" class="screen"><div class="card"><div class="metric" id="coachClientName"></div><div class="small" id="coachClientPosition"></div></div><h3>Supplements</h3><div class="card" id="coachSupplements"></div><h3>Notes</h3><div class="card"><p id="coachMemberNote"></p></div></section>

<nav id="memberNav" class="nav" style="display:none"><button onclick="showMember('home')">Home</button><button onclick="showMember('checkin')">Check-in</button><button onclick="showMember('progress')">Progress</button><button onclick="showMember('squad')">Squad</button><button onclick="showMember('profile')">Profile</button></nav>
<nav id="coachNav" class="nav" style="display:none"><button onclick="showCoach('coachHome')">Dashboard</button><button onclick="openClient()">Client</button><button>Messages</button><button>Reports</button><button>Settings</button></nav>

<script>
const $=id=>document.getElementById(id);
const DEFAULT={member:null,supplements:[],weight:null,sleep:null,water:0,steps:0,breakfast:false,breakfastSteps:null,foods:[],done:false};
let state=Object.assign({},DEFAULT,JSON.parse(localStorage.getItem('wellnessFixed2')||'{}'));
let draftSupplements=[];
function persist(){localStorage.setItem('wellnessFixed2',JSON.stringify(state))}
function hideAll(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'))}
function memberEntry(){if(state.member){showMember('home');return}hideAll();$('onboard').classList.add('active');$('pageTitle').textContent='Onboarding'}
function coachEntry(){showCoach('coachHome')}
function showMember(id){hideAll();$(id).classList.add('active');$('memberNav').style.display='grid';$('coachNav').style.display='none';$('pageTitle').textContent=id==='home'?'Member Home':id;$('pageSub').textContent=state.member?positionText():'Member';renderAll()}
function showCoach(id){hideAll();$(id).classList.add('active');$('memberNav').style.display='none';$('coachNav').style.display='grid';$('pageTitle').textContent=id==='coachHome'?'Coach Dashboard':'Client';renderCoach()}
function addSupplement(){const n=$('supplementNameInput').value.trim();if(!n)return alert('Enter supplement name');draftSupplements.push({name:n,start:$('supplementStartInput').value,note:$('supplementNoteInput').value.trim()});$('supplementNameInput').value='';$('supplementStartInput').value='';$('supplementNoteInput').value='';$('supplementDraftList').innerHTML=draftSupplements.map(x=>'<div class="row"><b>'+x.name+'</b><span>'+x.start+'</span></div>').join('')}
function finishOnboarding(){
 const startDate=$('startDateInput').value,sw=parseFloat($('startWeightInput').value),ug=parseFloat($('ultimateGoalInput').value);
 if(!startDate||Number.isNaN(sw)||Number.isNaN(ug))return alert('Add start date, start weight and ultimate goal');
 state.member={name:$('memberNameInput').value.trim()||'Test Member',coach:$('coachNameInput').value.trim()||'Test Coach',personality:$('personalityInput').value,start:startDate,startWeight:sw,sixGoal:parseFloat($('sixWeekGoalInput').value)||null,ultimate:ug};
 state.weight=sw;state.supplements=[...draftSupplements];persist();showMember('home');
}
function daysSinceStart(){const a=new Date(state.member.start+'T00:00:00'),b=new Date();b.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000))}
function cycleInfo(){const d=daysSinceStart();return{cycle:Math.floor(d/42)+1,day:d%42+1,date:new Date(new Date(state.member.start+'T00:00:00').getTime()+d*86400000)}}
function isProteinDay(day,date){return day<=3||date.getDay()===1}
function positionText(){const i=cycleInfo();return'Cycle '+i.cycle+' · Day '+i.day}
function saveMorning(){const w=parseFloat($('todayWeightInput').value),sl=parseFloat($('todaySleepInput').value);if(!Number.isNaN(w))state.weight=w;if(!Number.isNaN(sl))state.sleep=sl;persist();renderAll()}
function addSteps(x){if(state.breakfast)return;state.steps+=x;persist();renderAll()}function set5000(){if(!state.breakfast){state.steps=5000;persist();renderAll()}}
function markBreakfast(){if(state.breakfast)return;state.breakfast=true;state.breakfastSteps=state.steps;persist();renderAll()}
function addWater(x){state.water=+(state.water+x).toFixed(2);persist();renderAll()}
function addFood(){const n=$('foodNameInput').value.trim();if(!n)return;state.foods.push({n,c:+$('foodCarbsInput').value||0,p:+$('foodProteinInput').value||0});$('foodNameInput').value='';$('foodCarbsInput').value='';$('foodProteinInput').value='';persist();renderAll()}
function completeCheckin(){state.done=true;localStorage.setItem('wellnessFixedNote',$('coachNoteInput').value);persist();showMember('home')}
function totals(){return state.foods.reduce((a,x)=>({c:a.c+x.c,p:a.p+x.p}),{c:0,p:0})}
function renderCoach(){const note=localStorage.getItem('wellnessFixedNote')||'';let alerts=[];if(state.member){if(note)alerts.push('New note to coach');if(state.breakfast&&state.breakfastSteps<5000)alerts.push('B4B incomplete');if(!state.done)alerts.push('Check-in incomplete')}$('clientCount').textContent=state.member?1:0;$('attentionCount').textContent=alerts.length?1:0;$('alertList').innerHTML=alerts.length?alerts.map(x=>'<div class="row"><span>'+x+'</span><span class="tag">CHECK</span></div>').join(''):'No alerts';$('clientList').innerHTML=state.member?'<div class="row" onclick="openClient()"><div><b>'+state.member.name+'</b><div class="small">'+positionText()+'</div></div><span class="tag">'+(alerts.length?'CHECK':'ON TRACK')+'</span></div>':'No clients yet'}
function openClient(){if(!state.member)return alert('Create a test member first');showCoach('coachClient');$('coachClientName').textContent=state.member.name;$('coachClientPosition').textContent=positionText();$('coachMemberNote').textContent=localStorage.getItem('wellnessFixedNote')||'No note yet';$('coachSupplements').innerHTML=state.supplements.length?state.supplements.map(x=>'<div class="row"><div><b>'+x.name+'</b><div class="small">'+(x.start||'')+(x.note?' · '+x.note:'')+'</div></div></div>').join(''):'No supplements'}
function renderAll(){if(!state.member)return;const i=cycleInfo(),t=totals(),steps=state.breakfast?state.breakfastSteps:state.steps;$('positionText').textContent=positionText();$('proteinDayTag').style.display=isProteinDay(i.day,i.date)?'inline-flex':'none';$('homeWeight').textContent=state.weight?state.weight+' kg':'—';$('homeB4B').textContent=steps;$('homeWater').textContent=state.water.toFixed(1)+' L';$('checkWater').textContent=state.water.toFixed(1)+' L';$('homeCarbs').textContent=t.c+' g';$('checkB4B').textContent=steps+' / 5,000';$('foodList').innerHTML=state.foods.map(x=>'<div class="row"><span>'+x.n+'</span><span>'+x.c+'c · '+x.p+'p</span></div>').join('')||'No food logged';$('todayWeightInput').value=state.weight||'';$('todaySleepInput').value=state.sleep||'';$('progressPosition').textContent=positionText();$('progressType').textContent=isProteinDay(i.day,i.date)?'Protein day':'Regular day';$('profileCard').innerHTML='<div class="row"><span>Name</span><b>'+state.member.name+'</b></div><div class="row"><span>Coach</span><b>'+state.member.coach+'</b></div>';$('profileSupplements').innerHTML=state.supplements.map(x=>'<div class="row"><b>'+x.name+'</b><span>'+x.start+'</span></div>').join('')||'No supplements';renderCoach()}
$('startDateInput').value=new Date().toISOString().slice(0,10);if(state.member)renderAll();
</script></body></html>
